# YOLOv8 Dataset Configuration for BUS-SENSE AI
path: ../ai/dataset  # dataset root dir
train: images/train  # train images (relative to path)
val: images/val      # val images (relative to path)
test: images/test    # test images (optional)

# Classes
names:
  0: pothole
  1: road_damage
  2: road_debris
  3: waterlogging
  4: fallen_tree
  5: road_obstruction
  6: accident
  7: wrong_side_driving
  8: pedestrian_hazard
  9: vehicle_breakdown
